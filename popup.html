<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通用总结扩展</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="container">

  <!-- Options -->
  <div class="option-area" id="optionArea">
    <label class="checkbox-label"><input type="checkbox" id="screenshotCheckbox"><span id="screenshotLabel">图片提取·关</span></label>
    <label class="checkbox-label">
      <input type="checkbox" id="tempChatCheckbox">
      <span id="tempChatLabel" title="默认普通聊天；临时聊天·开时不会保存到知行批注书库">临时聊天·关</span>
    </label>
    <label class="checkbox-label">
      <input type="checkbox" id="bgOpenCheckbox">
      <span id="bgOpenLabel" title="仅决定最终是否切换到GPT；AI Studio中间转写始终在后台">GPT后台打开·关</span>
    </label>
    <label class="checkbox-label" id="forceAIStudioLabel" style="display:none">
      <input type="checkbox" id="forceAIStudioCheckbox">
      <span id="forceAIStudioLabelText"></span>
    </label>
  </div>

  <!-- Action -->
  <div class="action-area">
    <button class="run-btn" id="runBtn" disabled>扩展初始化中</button>
    <button id="cancelBtn" style="display:none;margin-top:8px">取消当前任务</button>
    <button id="optionsBtn" style="margin-top:8px">设置</button>
    <div class="status-text" id="statusText"></div>
  </div>

  <!-- Error Box -->
  <div class="error-box" id="errorBox"></div>

</div>

<script src="platforms.js"></script>
<script src="screenshot-settings.js"></script>
<script src="audio-settings.js"></script>
<script src="popup.js"></script>
</body>
</html>
